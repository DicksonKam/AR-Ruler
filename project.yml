name: AR-Ruler
options:
  bundleIdPrefix: io.github.dicksonkam
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "15.0"
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    PRODUCT_BUNDLE_IDENTIFIER: io.github.dicksonkam.ar-ruler
targets:
  AR-Ruler:
    type: application
    platform: macOS
    sources:
      - path: AR-Ruler
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: AR-Ruler/Resources/ARRuler.entitlements
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: AR-Ruler/Resources/Info.plist
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
  AR-RulerTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: AR-RulerTests
      # Compiled straight into the test bundle, so tests run without launching the app and its overlay.
      - path: AR-Ruler/Core
      - path: AR-Ruler/Measurement/MeasurementEngine.swift
      - path: AR-Ruler/Overlay/RulerRenderer.swift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        PRODUCT_BUNDLE_IDENTIFIER: io.github.dicksonkam.ar-ruler.tests
schemes:
  AR-Ruler:
    build:
      targets:
        AR-Ruler: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AR-RulerTests
