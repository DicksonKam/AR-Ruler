name: AR-Ruler
options:
  bundleIdPrefix: com.arruler
  deploymentTarget:
    macOS: "13.0"
  xcodeVersion: "15.0"
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    PRODUCT_BUNDLE_IDENTIFIER: com.arruler.app
targets:
  AR-Ruler:
    type: application
    platform: macOS
    sources:
      - path: AR-Ruler
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: AR-Ruler/Resources/ARRuler.entitlements
        GENERATE_INFOPLIST_FILE: false
        INFOPLIST_FILE: AR-Ruler/Resources/Info.plist
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
